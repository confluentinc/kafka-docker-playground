---
services:

  squid:
    image: ubuntu/squid
    hostname: squid
    container_name: squid
    ports:
      - "8888:8888"
    volumes:
      - ../../connect/connect-salesforce-pushtopics-source/squid/passwords:/etc/squid/passwords:z
      - ../../connect/connect-salesforce-pushtopics-source/squid/squid.conf:/etc/squid/squid.conf:z

  sfdx-cli:
    image: vdesabou/sfdx-cli:latest # forked from salestrip/sfdx-cli to add plugin sfpowerkit
    platform: linux/amd64
    hostname: sfdx-cli
    container_name: sfdx-cli
    command: "sleep infinity"
    environment:
      OPENSSL_ia32cap: "0x0"
    volumes:
    - ../../connect/connect-salesforce-pushtopics-source/MyLeadPushTopics.apex:/tmp/MyLeadPushTopics.apex:z

  connect:
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-salesforce
    #dns: 0.0.0.0