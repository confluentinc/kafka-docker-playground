---
services:

  nginx-proxy:
    image: reiz/nginx_proxy:latest
    platform: linux/amd64
    hostname: nginx-proxy
    container_name: nginx-proxy
    ports:
      - "8888:8888"
    volumes:
      - ../../connect/connect-salesforce-platform-events-source/nginx-proxy/nginx_whitelist.conf:/usr/local/nginx/conf/nginx.conf:z
      
  sfdx-cli:
    image: vdesabou/sfdx-cli:latest # forked from salestrip/sfdx-cli to add plugin sfpowerkit
    platform: linux/amd64
    hostname: sfdx-cli
    container_name: sfdx-cli
    command: "sleep infinity"
    environment:
      OPENSSL_ia32cap: "0x0"
    volumes:
    - ../../connect/connect-salesforce-platform-events-source/event.apex:/tmp/event.apex:z

  connect:
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-salesforce
    #dns: 0.0.0.0
    