---
services:

  nginx-proxy:
    # No confirmed s390x manifest; run under QEMU emulation on s390x.
    image: reiz/nginx_proxy:latest
    platform: linux/amd64
    hostname: nginx-proxy
    container_name: nginx-proxy
    ports:
      - "8888:8888"
    volumes:
      - ../../connect/connect-http-source/nginx-proxy/nginx_whitelist.conf:/usr/local/nginx/conf/nginx.conf:z

  connect:
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-http-source

  httpserver:
    # vdesabou/http-sink-demo publishes no s390x manifest; run under QEMU emulation on s390x.
    image: vdesabou/http-sink-demo
    platform: linux/amd64
    hostname: httpserver
    container_name: httpserver
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: 'simple-auth'