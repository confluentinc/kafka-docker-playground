---
services:

  nginx-proxy:
    image: reiz/nginx_proxy:latest
    platform: linux/amd64
    hostname: nginx-proxy
    container_name: nginx-proxy
    ports:
      - "8888:8888"
    volumes:
      - ../../connect/connect-servicenow-source/nginx-proxy/nginx_whitelist.conf:/usr/local/nginx/conf/nginx.conf:z

  connect:
    volumes:
      - ../../connect/connect-servicenow-source/nginx-proxy/logging.properties:/tmp/logging.properties:z
    environment:
      KAFKA_OPTS: -Djava.util.logging.config.file=/tmp/logging.properties
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-servicenow
    #dns: 0.0.0.0
