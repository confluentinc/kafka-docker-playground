---
services:
  connect:
    volumes:
      - ../../connect/connect-azure-event-hubs-source/data:/data
    environment:
      CONNECT_PLUGIN_PATH: /usr/share/confluent-hub-components/confluentinc-kafka-connect-azure-event-hubs

  simple-send:
    image: eclipse-temurin:11-jre
    hostname: simple-send
    container_name: simple-send
    volumes:
      - ../../connect/connect-azure-event-hubs-source/simple-send/target/simplesend-1.0.0-jar-with-dependencies.jar:/simplesend-1.0.0-jar-with-dependencies.jar:ro,z
    command: ["sleep", "infinity"]
    depends_on:
      - broker